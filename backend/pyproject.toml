[project]
name = "studymate-backend"
version = "0.1.0"
description = "StudyMate AI backend - multi-agent learning system"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "uvicorn[standard]>=0.32",
  "structlog>=24.4",
  "pdfplumber>=0.11",
  "sentence-transformers>=3.2",
  "chromadb>=0.5.20",
  "anthropic>=0.39",
  "pyyaml>=6.0",
  "typer>=0.13",
  "langgraph>=0.2.50",
  "langgraph-checkpoint-sqlite>=2.0",
  "langchain-core>=0.3.20",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14.0",
  "jinja2>=3.1.4",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "httpx>=0.27",
  "ruff>=0.7",
  "mypy>=1.13",
  "import-linter>=2.1",
  "pytest-mock>=3.14",
  "reportlab>=4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RET", "PL", "PT"]
ignore = ["PLR0913"]  # too-many-arguments — FastAPI 라우터엔 흔함

[tool.mypy]
python_version = "3.12"
strict = true
disallow_untyped_decorators = false  # FastAPI 데코레이터 호환
warn_return_any = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["reportlab.*"]
ignore_missing_imports = true

# chromadb's own types are overly strict (rejects list[list[float]] for
# embeddings, returns Optional containers from query()). Treat as untyped
# external library — mirrors the reportlab override.
[[tool.mypy.overrides]]
module = ["chromadb.*"]
ignore_missing_imports = true
follow_imports = "skip"

# PyYAML ships no inline types; we don't pull in types-PyYAML stubs.
[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "langgraph.*"
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = "langchain_core.*"
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-ra --strict-markers --cov=app --cov-report=term-missing"
testpaths = ["tests"]
